<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spot Placement Score × Price Dashboard</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb;
    --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10);
    --s-apne1: #2a78d6; --s-apne2: #eb6834; --s-use1: #1baf7a; --s-use2: #eda100; --s-usw2: #e87ba4;
    --good: #0ca30c; --bad: #d03b3b;
    --wash-good: rgba(42,120,214,0.07); --btn-on: #0b0b0b; --btn-on-ink: #fcfcfb;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19;
      --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
      --s-apne1: #3987e5; --s-apne2: #d95926; --s-use1: #199e70; --s-use2: #c98500; --s-usw2: #d55181;
      --good: #0ca30c; --bad: #e66767;
      --wash-good: rgba(57,135,229,0.12); --btn-on: #ffffff; --btn-on-ink: #1a1a19;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
    --s-apne1: #3987e5; --s-apne2: #d95926; --s-use1: #199e70; --s-use2: #c98500; --s-usw2: #d55181;
    --good: #0ca30c; --bad: #e66767;
    --wash-good: rgba(57,135,229,0.12); --btn-on: #ffffff; --btn-on-ink: #1a1a19;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb;
    --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10);
    --s-apne1: #2a78d6; --s-apne2: #eb6834; --s-use1: #1baf7a; --s-use2: #eda100; --s-usw2: #e87ba4;
    --good: #0ca30c; --bad: #d03b3b;
    --wash-good: rgba(42,120,214,0.07); --btn-on: #0b0b0b; --btn-on-ink: #fcfcfb;

  body { background: var(--page); color: var(--ink);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    margin: 0; padding: 28px 20px 60px; }
  .wrap { max-width: 1080px; margin: 0 auto; }
  header .headrow { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
  header h1 { font-size: 1.45rem; margin: 0 0 4px; text-wrap: balance; }
  header .sub { color: var(--ink-2); font-size: 0.9rem; margin: 0; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin: 16px 0 6px; }
  .ranges, .chips, .langsw { display: inline-flex; border: 1px solid var(--ring); border-radius: 8px; overflow: hidden; flex: none; }
  .ranges button, .chips button, .langsw button { font: 600 0.8rem/1 system-ui, sans-serif; padding: 7px 12px; border: none; cursor: pointer;
    background: var(--surface); color: var(--ink-2); }
  .ranges button + button, .chips button + button, .langsw button + button { border-left: 1px solid var(--ring); }
  .ranges button[aria-pressed="true"], .chips button[aria-pressed="true"], .langsw button[aria-pressed="true"] { background: var(--btn-on); color: var(--btn-on-ink); }
  .ranges button:focus-visible, .chips button:focus-visible, .langsw button:focus-visible { outline: 2px solid var(--s-apne1); outline-offset: -2px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; }
  .legend .chip { display: inline-flex; align-items: center; gap: 7px; font-size: 0.85rem; color: var(--ink-2); }
  .legend .sw { width: 12px; height: 12px; border-radius: 3px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin: 14px 0 8px; }
  .tile { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 14px 16px; }
  .tile .k { font-size: 0.74rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .tile .v { font-size: 1.3rem; font-weight: 650; }
  .tile .d { font-size: 0.83rem; color: var(--ink-2); margin-top: 2px; }
  section.type { margin-top: 36px; }
  section.type > h2 { font-size: 1.08rem; margin: 0 0 2px; }
  section.type .note { color: var(--ink-2); font-size: 0.85rem; margin: 0 0 12px; }
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  @media (max-width: 860px) { .charts { grid-template-columns: 1fr; } }
  .card { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 12px 14px 8px; position: relative; }
  .card h3 { font-size: 0.85rem; font-weight: 600; color: var(--ink-2); margin: 0 0 6px; }
  .card .span { font-weight: 400; color: var(--muted); }
  .card svg { display: block; width: 100%; height: auto; }
  .empty { color: var(--muted); font-size: 0.85rem; padding: 40px 0; text-align: center; }
  .tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--ring);
    border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,0.14); padding: 8px 11px; font-size: 0.78rem;
    display: none; z-index: 3; min-width: 150px; }
  .tip .t { color: var(--muted); margin-bottom: 4px; }
  .tip .row { display: flex; align-items: center; gap: 6px; margin: 1px 0; color: var(--ink-2); }
  .tip .row b { margin-left: auto; color: var(--ink); font-variant-numeric: tabular-nums; }
  .tip .sw { width: 9px; height: 9px; border-radius: 2px; flex: none; }
  .tblwrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; }
  .ranks { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 12px; }
  .ranks .cap { font-size: 0.85rem; font-weight: 650; padding: 9px 14px 0; }
  table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
  th, td { text-align: left; padding: 7px 14px; white-space: nowrap; }
  thead th { color: var(--muted); font-weight: 600; font-size: 0.74rem; letter-spacing: 0.04em; text-transform: uppercase;
    border-bottom: 1px solid var(--grid); }
  tbody td { border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr.good { background: var(--wash-good); }
  td .sw, .note .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 7px; }
  .ok { color: var(--good); font-weight: 650; }
  .no { color: var(--bad); font-weight: 650; }
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 0.78rem; padding: 2px 8px;
    border: 1px solid var(--ring); border-radius: 999px; color: var(--ink-2); margin: 0 6px 4px 0; }
  .fine { color: var(--muted); font-size: 0.78rem; margin-top: 8px; }
  .explain { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 10px 0 6px; }
  @media (max-width: 860px) { .explain { grid-template-columns: 1fr; } }
  .explain .card h3 { font-size: 0.95rem; font-weight: 650; color: var(--ink); margin: 2px 0 8px; }
  .explain p { font-size: 0.88rem; color: var(--ink-2); margin: 0 0 8px; max-width: 62ch; }
  .explain ul { font-size: 0.88rem; color: var(--ink-2); margin: 0; padding-left: 18px; }
  .explain li { margin: 3px 0; }
  .explain b { color: var(--ink); font-weight: 600; }
  .hm { display: grid; grid-template-columns: 28px repeat(24, 1fr); gap: 2px; margin-top: 4px; }
  .hm .lab { font-size: 0.66rem; color: var(--muted); align-self: center; }
  .hm .cl { font-size: 0.6rem; color: var(--muted); text-align: center; }
  .hm .cell { aspect-ratio: 1 / 1.15; border-radius: 3px; background: transparent; border: 1px solid var(--grid);
    display: flex; align-items: center; justify-content: center; font-size: 0.62rem; font-variant-numeric: tabular-nums; }
  .hm .cell.f { border-color: transparent; }
  h2.top { font-size: 1.08rem; margin: 26px 0 8px; }
  svg text { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--muted); }
  svg .dl { font-size: 11px; font-weight: 600; fill: var(--ink-2); }
</style>
</head>
<body>

function clampSeries(arr, cutoff) {
  if (!arr || !arr.length) return [];
  const out = []; let carry = null;
  for (const [ts, v] of arr) {
    if (Date.parse(ts) < cutoff) carry = v; else out.push([ts, v]);
  }
  if (carry !== null) out.unshift([new Date(cutoff).toISOString(), carry]);
  return out;
}
function drawChart(card, seriesMap, opts) {

  const keys = opts.keys.filter(k => seriesMap[k] && seriesMap[k].length > 1);
  if (!keys.length) { card.insertAdjacentHTML('beforeend', `<div class="empty">${t().chartEmpty}</div>`); return; }
  let tMin = Infinity, tMax = -Infinity, vMax = 0;
  keys.forEach(k => seriesMap[k].forEach(([ts, v]) => {
    const tt = Date.parse(ts); tMin = Math.min(tMin, tt); tMax = Math.max(tMax, tt); vMax = Math.max(vMax, v);
  }));
  const yMax = opts.yMax || Math.max(1, Math.ceil(vMax * 1.15));
  const x = tt => m.l + (tt - tMin) / (tMax - tMin) * (W - m.l - m.r);
  const y = v => H - m.b - v / yMax * (H - m.t - m.b);
  const xfmt = (tMax - tMin) > 3 * 864e5 ? kstDay : kst;
  let g = '';
  const yTicks = opts.yMax === 10 ? [0, 2, 4, 6, 8, 10] : Array.from({ length: 5 }, (_, i) => Math.round(yMax / 4 * i * 100) / 100);
  yTicks.forEach(v => { g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>
    <text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end">${opts.yFmt(v)}</text>`; });
  for (let i = 0; i <= 4; i++) { const tt = tMin + (tMax - tMin) * i / 4;
    g += `<text x="${x(tt)}" y="${H - 8}" text-anchor="middle">${xfmt(tt)}</text>`; }
  g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)" stroke-width="1"/>`;
  keys.forEach((k, i) => {
    const off = opts.step ? (i - (keys.length - 1) / 2) * 2 : 0;
    const pts = seriesMap[k].map(([ts, v]) => [x(Date.parse(ts)), y(v) + off]);
    let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
    for (let j = 1; j < pts.length; j++) {
      d += opts.step ? `H${pts[j][0].toFixed(1)}V${pts[j][1].toFixed(1)}` : `L${pts[j][0].toFixed(1)},${pts[j][1].toFixed(1)}`;
    }
    const lp = pts[pts.length - 1], lv = seriesMap[k][seriesMap[k].length - 1][1];
    g += `<path d="${d}" fill="none" stroke="${opts.colorOf(k)}" stroke-width="2" stroke-linejoin="round"/>`;
    g += `<circle cx="${lp[0]}" cy="${lp[1]}" r="3.5" fill="${opts.colorOf(k)}" stroke="var(--surface)" stroke-width="2"/>`;
    g += `<text class="dl" x="${lp[0] + 8}" y="${lp[1] + 4 + (opts.step ? off * 2.2 : 0)}">${opts.labelOf(k)} ${opts.yFmt(lv)}</text>`;
  });
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = g + `<line class="xh" y1="${m.t}" y2="${H - m.b}" stroke="var(--axis)" stroke-width="1" visibility="hidden"/>`;
  card.appendChild(svg);
  const tip = document.createElement('div'); tip.className = 'tip'; card.appendChild(tip);
  const xh = svg.querySelector('.xh');
  svg.addEventListener('mousemove', e => {
    const rect = svg.getBoundingClientRect();
    const tt = tMin + (Math.min(Math.max((e.clientX - rect.left) / rect.width * W, m.l), W - m.r) - m.l) / (W - m.l - m.r) * (tMax - tMin);
    xh.setAttribute('x1', x(tt)); xh.setAttribute('x2', x(tt)); xh.setAttribute('visibility', 'visible');
    let rows = '';
    keys.forEach(k => {
      const s = seriesMap[k]; let best = s[0];
      for (const p of s) { if (Math.abs(Date.parse(p[0]) - tt) < Math.abs(Date.parse(best[0]) - tt)) best = p; }
      rows += `<div class="row"><span class="sw" style="background:${opts.colorOf(k)}"></span>${opts.labelOf(k)}<b>${opts.yFmt(best[1])}</b></div>`;
    });

    tip.style.display = 'block';

  });

function renderHeatmap(el, type, region) {
  const s = DATA.scores[type]?.[region];
  if (!s || !s.length) { el.innerHTML = `<div class="empty">${t().heatmapNoData}</div>`; return; }
  const agg = Array.from({ length: 7 }, () => Array.from({ length: 24 }, () => []));
  for (const [ts, v] of s) {
    const d = new Date(Date.parse(ts) + 9 * 3600e3);   // KST
    agg[d.getUTCDay()][d.getUTCHours()].push(v);
  }
  const dows = t().dows;
  const order = [1, 2, 3, 4, 5, 6, 0];   // 월~일
  let h = '<div class="hm"><div></div>';
  for (let c = 0; c < 24; c++) h += `<div class="cl">${c % 6 === 0 ? c : ''}</div>`;
  for (const d of order) {
    h += `<div class="lab">${dows[d]}</div>`;
    for (let c = 0; c < 24; c++) {
      const vs = agg[d][c];
      if (!vs.length) { h += `<div class="cell" title="${t().heatmapNoData}"></div>`; continue; }
      const avg = vs.reduce((a, b) => a + b) / vs.length;
      const idx = Math.min(6, Math.max(0, Math.floor((avg - 1) / 9 * 7)));
      const fg = idx >= 3 ? '#ffffff' : '#0b0b0b';
      h += `<div class="cell f" style="background:${SEQ[idx]};color:${fg}" title="${t().heatmapCellTitle(dows[d], c, avg.toFixed(1), vs.length)}">${Math.round(avg)}</div>`;
    }
  }
  el.innerHTML = h + '</div>';
}

      renderTypeExtras(type);
    });
    renderTypeExtras(type);
  });
}

renderSummary();
renderAll();

} catch (e) {
  const LANG_SAFE = (typeof LANG !== 'undefined' && I18N[LANG]) ? LANG : 'en';
  document.getElementById('sections').innerHTML = `<p class="empty">${I18N[LANG_SAFE].loadError(e)}</p>`;
  console.error(e);
}
})();
</script>
